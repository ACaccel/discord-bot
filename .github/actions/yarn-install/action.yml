name: 'Yarn install'
description: 'Setup Node from .nvmrc and run yarn install --frozen-lockfile with cache'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'yarn'
    - run: yarn install --frozen-lockfile
      shell: bash
