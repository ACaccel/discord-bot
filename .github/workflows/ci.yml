name: CI

on:
  # PR branches are exercised by `pull_request`; the `push` trigger
  # stays scoped to the long-lived branches (`main`, `dev`) so a push to
  # a feature branch does not fire both events back-to-back (the
  # duplicate doubled CI cost without adding any signal — the PR run
  # already covers the same commit).
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/yarn-install
      - run: yarn lint
      - run: yarn format:check
      - run: yarn handlers:gen:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/yarn-install
      # `tsconfig.strict.json` includes the whole `src/` tree, so
      # `yarn typecheck` compiles `src/bot/<name>/index.ts`, which
      # `import`s the gitignored per-bot `config.json`. Seed it so type
      # resolution succeeds — same reason as `typecheck-emit`.
      - uses: ./.github/actions/seed-bot-config
      - run: yarn typecheck

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/yarn-install
      - run: yarn test:unit
      - run: yarn test:i18n

  test-tools:
    # Unit tests for the standalone ops scripts under `tools/<name>/`
    # (msg_backup / verify_db). They run the `tools` vitest project,
    # which exercises pure internals only — no Discord/Mongo boot — so
    # no `seed-bot-config` is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/yarn-install
      - run: yarn test:tools

  test-coverage:
    # Coverage floors (`src/core/**` ≥ 90%, overall ≥ baseline) live in
    # vitest.config.ts; this job is the gate that enforces them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/yarn-install
      - run: yarn test:coverage

  test-int:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/yarn-install
      # Run integration tests with JSON reporter so the next step can
      # verify the project actually loaded files (no silent green).
      # `test:int` does not pass `--passWithNoTests`, so vitest itself
      # exits nonzero on a glob mismatch; the JSON guard below is
      # defense-in-depth for the case where suites load but every test
      # inside them is skipped.
      - name: Run integration tests
        run: yarn test:int --reporter=json --outputFile=.vitest-int.json
      # Empty-project guard: a zero-suite run means the vitest project
      # glob is broken — fail the build.
      - name: Empty-project guard
        run: |
          set -euo pipefail
          if [ -f .vitest-int.json ]; then
            suites="$(jq '.numTotalTestSuites // 0' .vitest-int.json)"
          else
            suites=0
          fi
          echo "::notice::numTotalTestSuites=$suites"
          if [ "$suites" -gt 0 ]; then
            echo "Integration test suites present; guard satisfied."
            exit 0
          fi
          echo "::error::Expected at least one integration test suite, but vitest reported 0."
          exit 1

  test-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/yarn-install
      - name: Run contract tests
        run: yarn test:contract --reporter=json --outputFile=.vitest-contract.json
      # Empty-project guard: a zero-suite run means the vitest project
      # glob is broken — fail the build.
      - name: Empty-project guard
        run: |
          set -euo pipefail
          if [ -f .vitest-contract.json ]; then
            suites="$(jq '.numTotalTestSuites // 0' .vitest-contract.json)"
          else
            suites=0
          fi
          echo "::notice::numTotalTestSuites=$suites (contract)"
          if [ "$suites" -gt 0 ]; then exit 0; fi
          echo "::error::Expected at least one contract test suite, but vitest reported 0."
          exit 1

  knip:
    # Detects unused exports / files / dependencies. The `knip.json`
    # rules table errors on file / dependency drift but keeps the
    # per-symbol checks (`exports`, `types`, `nsExports`, `nsTypes`,
    # `enumMembers`, `classMembers`) at `warn`, so an unused export is
    # surfaced without failing the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/yarn-install
      - run: yarn knip

  typecheck-emit:
    # Confirm `tsc -p tsconfig.build.json` actually compiles outside
    # the strict-tsconfig include scope. `yarn
    # typecheck` runs noEmit on the strict project; this job runs the
    # whole src/ tree through emit-mode tsc so a broken `import`
    # outside the strict scope is caught at PR time, not runtime.
    #
    # NOTE: this is NOT a deploy build. Runtime is `ts-node` from
    # source (see `yarn nijika` etc. in package.json). The emitted
    # `dist/` retains TS path aliases (`require("@utils")`) and does
    # not bundle non-TS assets (config.json / locale JSON), so
    # invoking `node dist/...` would fail. The artifact-presence
    # check that used to live here was misleading and was removed
    # — the only signal this job carries is whether tsc emits
    # cleanly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/seed-bot-config
      - run: yarn typecheck:emit

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history
      - uses: ./.github/actions/yarn-install
      - name: audit-ci (HIGH+ with documented allowlist)
        run: yarn security --output-format=json | tee audit-ci-report.json
      - name: Archive audit report + allowlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-ci-report-${{ github.run_id }}
          path: |
            audit-ci-report.json
            audit-ci.jsonc
          retention-days: 90
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
